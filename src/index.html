<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Holnex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/logo-blue.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    .app-splash {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10000;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #ffffff;
    }

    .app-splash img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .app-splash-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(15, 76, 92, 0.2);
      border-top-color: #0F4C5C;
      border-radius: 50%;
      animation: app-splash-spin 0.8s linear infinite;
    }

    @keyframes app-splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <app-splash class="app-splash" id="app-splash">
    <img src="assets/logo-holnex.svg" alt="Holnex">
    <div class="app-splash-spinner" aria-hidden="true"></div>
  </app-splash>
  <app-root></app-root>
</body>

</html>
